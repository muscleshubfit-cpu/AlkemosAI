# سير تقييم M2 على البطارية — تشغيل يدوي (GGUF مكمّم على عدّاء مجاني)
##
# القواعد (SECURITY §8.6 النمط المعتمد):
#   - تشغيل يدوي فقط (workflow_dispatch) — لا جدولة ولا دفع/PR.
#   - بلا أي أسرار إطلاقًا: نماذج عامة من HF تُنزَّل قراءة-فقط بلا توكن (R-35).
#   - لا تدريب أوزان ولا توليد إنتاجي ولا مساس بإنتاج Alkemos (D-11/ADR-0022).
#   - النتائج تُرفع كـ artifact وتُلحق أيضًا بالمستودع تحت evaluation/results/m2/
#     (الغرض: توثيق النتائج الموقعة — evaluation/README ق4).
#   - الفحوص: فشل التشغيل يخفق البناء (لا نتائج صامتة ناقصة).
#   - (دفعة 14) فحوص v2 سارية تلقائيًا (سلامة ثنائية مصنفة · لغة الرد · تنقية harmony ·
#     اكتمال · فواصل آلاف) + مجسات v1.1 ثنائية اللغة + تمرير n_ctx الذي كان معرفًا
#     كمدخل وغير مستخدم (أُصلح تلك الدفعة).
#   - (دفعة 15 — فشل تشغيل Jais رقم 45176791920) قانون عدم فقد المراحل:
#     نتائج البطارية تُلزم وتُدفع فور نجاحها (قبل المجسات إطلاقًا) · خطوة المجسات
#     continue-on-error مع كتابة تدريجية في العدّاء (فشل مجس لا يهدر المنجز) ·
#     نتائج المجسات تُلزم if:always · الأدلة تُرفع if:always · بوابة ختامية
#     تُبقي البناء أحمر إن أخفقت المجسات (الرؤية محفوظة والنتائج محفوظة).

name: m2-battery-gguf
on:
  workflow_dispatch:
    inputs:
      model_alias:
        description: "وسم النموذج في النتائج (مثل Jais-3-7B-Q4_K_M)"
        required: true
      hf_file_url:
        description: "رابط ملف GGUF الكامل من HF (عام)"
        required: true
      n_ctx:
        description: "سياق (افتراضي 4096)"
        required: false
        default: "4096"
      battery_max_tokens:
        description: "حد رموز البطارية (افتراضي 320 — للنماذج ذات التفكير الإلزامي الطويل: 1024 موثقًا كانحراف بروتوكول)"
        required: false
        default: "320"
      probes_max_tokens:
        description: "حد رموز المجسات (افتراضي 420 — للنماذج ذات التفكير الإلزامي الطويل: 1280 موثقًا كانحراف بروتوكول)"
        required: false
        default: "420"

permissions:
  contents: write

concurrency:
  group: m2-battery-${{ inputs.model_alias }}
  cancel-in-progress: false

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout (قراءة-فقط للمستودع)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install llama-cpp-python (CPU wheel)
        run: |
          pip install --quiet cmake
          pip install --quiet --no-cache-dir --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          python -c "import llama_cpp; print('llama-cpp-python OK')"

      - name: Download GGUF (عام، بلا توكن)
        run: |
          mkdir -p /tmp/m2models
          curl -sL --retry 4 --retry-delay 5 -C - -o "/tmp/m2models/model.gguf" "${{ inputs.hf_file_url }}"
          ls -lh /tmp/m2models/model.gguf

      - name: Run battery (stratified sample 36)
        run: |
          mkdir -p evaluation/results/m2
          python3 scripts/m2_run_battery.py \
            --channel gguf \
            --model /tmp/m2models/model.gguf \
            --sample-n 36 \
            --max-tokens "${{ inputs.battery_max_tokens }}" \
            --n-ctx "${{ inputs.n_ctx }}" \
            --out-dir evaluation/results/m2 \
            --tag "${{ inputs.model_alias }}"

      - name: Commit battery results immediately (قانون عدم فقد المراحل — دفعة 15)
        run: |
          git config user.name "alkemosai-m2-runner"
          git config user.email "runner@alkemosai.local"
          git add evaluation/results/m2/
          if ! git diff --cached --quiet; then
            git commit -m "eval(M2 آلي): نتائج بطارية ${{ inputs.model_alias }} — عينة طبقية 36 (حفظ فوري بعد نجاح البطارية — سير m2-battery-gguf، بلا أسرار)"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push conflict — retry $i"; sleep 20
            done
          else
            echo "battery results already pushed (or nothing new)"
          fi

      - name: Run trainer probes (v1.2 — فحوص مصححة إحالة طبية كاشفة + تسامح رقمي مضبوط)
        id: probes
        continue-on-error: true
        run: |
          python3 scripts/m2_run_battery.py \
            --channel gguf \
            --model /tmp/m2models/model.gguf \
            --probes \
            --probes-file evaluation/m2/m2-trainer-probes-v1.2.jsonl \
            --max-tokens "${{ inputs.probes_max_tokens }}" \
            --n-ctx "${{ inputs.n_ctx }}" \
            --out-dir evaluation/results/m2 \
            --tag "${{ inputs.model_alias }}"

      - name: Commit probe results (if:always — المنجز الجزئي يُحفظ أيضًا)
        if: always()
        run: |
          git config user.name "alkemosai-m2-runner"
          git config user.email "runner@alkemosai.local"
          git add evaluation/results/m2/
          if ! git diff --cached --quiet; then
            git commit -m "eval(M2 آلي): نتائج مجسات ${{ inputs.model_alias }} — مجسات المدرب v1.2 (سير m2-battery-gguf، بلا أسرار)"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push conflict — retry $i"; sleep 20
            done
          else
            echo "probe results already pushed (or nothing new)"
          fi

      - name: Upload artifacts (if:always — الأدلة تُرفع مهما كان مآل المجسات)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-results-${{ inputs.model_alias }}
          path: evaluation/results/m2/
          retention-days: 90

      - name: Outcome gate (فشل المجسات يُبقي البناء أحمر — لا نتائج صامتة ناقصة)
        if: always()
        run: |
          echo "probes_outcome=${{ steps.probes.outcome }}"
          if [ "${{ steps.probes.outcome }}" = "failure" ]; then
            echo "::error::فشلت المجسات — نتائج البطارية (والمجسات المنجزة) ملتزمة والأدلة مرفوعة؛ انظر السجل للسبب"
            exit 1
          fi
