name: "M4 — اختبارات محرك الذاكرة والتعلم (engine/)"

# دفعة 16 وتتمتها — M4-ذاكرة-1: كل اختبارات المحرك تعمل مع كل دفع يمس engine/
# أو اختباراته أو البطاقات — بلا أسرار إطلاقًا (وضعية R-35: سير عام بلا أسرار)
# وبصلاحيات قراءة فقط. لا يمس هذا السير أي سير من سيور M2 القائمة.
# (استكمال 16-تتمة): أُصلح مُرشّح الفروع (كان تالفًا فلا ينطلق السير على
# push إلى main)، وأُدرجت حزمة اختبارات الأمن scripts/test_engine_security.py
# ضمن التنفيذ، وصُحّح عدّاد الفحوص ليطابق التنفيذ الفعلي.
# (دفعة 17 — الهوية الموحدة ADR-0023): حذفت حزمة مصادقة المالك المستقلة
# scripts/test_engine_owner_auth.py (المسار المستقل أُلغي) وأُدرجت حزمتان
# جديدتان: scripts/test_engine_identity.py (81 فحصًا — العقد والمحلل
# والمزودات والفهرس والعزل) وscripts/test_engine_identity_integration.py
# (27 فحصًا — محاكاة التكامل بين النظامين بمزود الاستعلام الحقيقي ضد خادم
# محاكاة loopback) وتوسعت حزمة الأمن بقسم «لا مسار مصادقة مستقل»
# (84 → 90) — والعدّاد 383 ليطابق التنفيذ الفعلي.
# (مراجعة دفعة 17 — أمر المالك): بوابة جلسة الخدمة صارت تتطلب برهان خادم
# (مفاتيح عامة مثبتة ALKEMOS_SERVICE_CALLER_KEYS — حد الثقة بين الموقع
# والمحرك) فتوسعت حزمة الهوية (81 → 104: برهان الخادم 14 فحصًا + سياسة
# مفاتيح RSA ≥2048 قبل التوقيع 6 فحوص + بيانات الفهرس ليست هوية/صلاحية 4)
# وحصل اختبار التكامل على فحص بوابة الخدمة (27 → 28) — والعدّاد 407
# ليطابق التنفيذ الفعلي.
# (دفعة 16 — هوية المالك وأمانها): أُدرجت حزمة مصادقة المالك
# scripts/test_engine_owner_auth.py (57 فحصًا) وتوسعت حزمة الأمن بالتزوير
# الواقعي داخل العملية (75 → 84) — والعدّاد 326 ليطابق التنفيذ الفعلي.

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "scripts/test_engine_*.py"
      - "scripts/test_m4_*.py"
      - "scripts/m4_*.py"
      - "memory/cards/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - "scripts/test_engine_*.py"
      - "scripts/test_m4_*.py"
      - "scripts/m4_*.py"
      - "memory/cards/**"
      - ".github/workflows/engine-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: engine-tests
  cancel-in-progress: false

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # العدّاد يطابق التنفيذ الفعلي (مراجعة دفعة 17): ذاكرة 47 · معرفة 18
      # · تعلم 55 · بوابة 47 · أمن 90 (منها تزوير واقعي داخل العملية + قسم
      # لا مسار مصادقة مستقل) · هوية موحدة 104 (منها برهان الخادم لبوابة
      # الخدمة + سياسة مفاتيح RSA ≥2048 + الفهرس ليس هوية) · تكامل محاكى 28
      # · مصدّر 9 · دورة 9 = 407 فحصًا (حزم الأمن والهوية: محاولات تزييف
      # وتجاوز وفشل مغلق ومحاكاة تكامل النظامين — موجبة وسلبية).
      - name: تشغيل اختبارات المحرك (407 فحصًا)
        run: |
          set -euo pipefail
          for t in \
            scripts/test_engine_memory.py \
            scripts/test_engine_knowledge.py \
            scripts/test_engine_learning.py \
            scripts/test_engine_gateway_gex.py \
            scripts/test_engine_security.py \
            scripts/test_engine_identity.py \
            scripts/test_engine_identity_integration.py \
            scripts/test_engine_exporter.py \
            scripts/test_m4_learning_cycle.py
          do
            echo "════ $t ════"
            python "$t"
          done
